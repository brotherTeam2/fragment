<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jira Issue Table Fragment</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/latest/bridge.js"></script>
  <style>
    #issueTable {
      border-collapse: collapse;
      width: 100%;
      font-family: Arial, sans-serif;
    }
    #issueTable th,
    #issueTable td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .col1 { background-color: #e6f4ff; }
    .col2 { background-color: #e8ffe6; }
    .col3 { background-color: #fff4e6; }
  </style>
</head>
<body>
  <div>
    <table id="issueTable">
      <thead>
        <tr>
          <th class="col1">Step</th>
          <th class="col2">Assignee</th>
          <th class="col3">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col1" id="col1-r1-value">Loading...</td>
          <td class="col2" id="col2-r1-value">Loading...</td>
          <td class="col3" id="col3-r1-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r2-value">Loading...</td>
          <td class="col2" id="col2-r2-value">Loading...</td>
          <td class="col3" id="col3-r2-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r3-value">Loading...</td>
          <td class="col2" id="col2-r3-value">Loading...</td>
          <td class="col3" id="col3-r3-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r4-value">Loading...</td>
          <td class="col2" id="col2-r4-value">Loading...</td>
          <td class="col3" id="col3-r4-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r5-value">Loading...</td>
          <td class="col2" id="col2-r5-value">Loading...</td>
          <td class="col3" id="col3-r5-value">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function waitForContext(tries) {
    tries = tries || 0;

    if (AdaptavistBridge && AdaptavistBridgeContext && AdaptavistBridgeContext.context) {
      loadIssueWithContext(AdaptavistBridgeContext.context);
      return;
    }
    if (tries > 20) {
      for (var i = 1; i <= 5; i++) {
        setText(`col1-r${i}-value`, 'No context from bridge');
        setText(`col2-r${i}-value`, 'No context from bridge');
        setText(`col3-r${i}-value`, 'No context from bridge');
      }
      return;
    }
    setTimeout(function () { waitForContext(tries + 1); }, 100);
  }

  function loadIssueWithContext(ctx) {
    var issueKey = ctx && ctx.issueKey ? ctx.issueKey : 'AP-1';
    AdaptavistBridge.request({
      url: `/rest/api/2/issue/${issueKey}`,
      type: 'GET'
    })
    .then(function(issue) {
      console.log('Issue:', issue);
      console.log('Links:', issue.issuelinks);

      var links = issue.issuelinks || [];
      for (var i = 0; i < 5; i++) {
        if (links[i] && links[i].outwardIssue) {
          var linkedIssue = links[i].outwardIssue;
          setText(`col1-r${i+1}-value`, linkedIssue.fields.summary || 'No summary');
          setText(`col2-r${i+1}-value`, linkedIssue.fields.assignee ? linkedIssue.fields.assignee.displayName : 'Unassigned');
          setText(`col3-r${i+1}-value`, linkedIssue.fields.status ? linkedIssue.fields.status.name : 'No status');
        } else {
          setText(`col1-r${i+1}-value`, 'No linked issue');
          setText(`col2-r${i+1}-value`, '');
          setText(`col3-r${i+1}-value`, '');
        }
      }
    })
    .catch(function(err) {
      console.error('Error loading issue:', err);
      for (var i = 1; i <= 5; i++) {
        setText(`col1-r${i}-value`, 'Error loading issue');
        setText(`col2-r${i}-value`, 'Error loading issue');
        setText(`col3-r${i}-value`, 'Error loading issue');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { waitForContext(0); }, 200);
  });
</script>
</body>
</html>
