<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jira Issue Table Fragment</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/latest/bridge.js"></script>
  <style>
    div {
    width: 100%;
    overflow-x: auto;
    margin: 20px 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #issueTable {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    background: #fff;
    box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
    border-radius: 6px;
    overflow: hidden;
    }

    #issueTable th, #issueTable td {
    padding: 12px 15px;
    text-align: left;
    white-space: nowrap;
    vertical-align: middle;
    }

    #issueTable thead {
    background-color: #0052cc; /* Jira blue */
    color: white;
    font-weight: 600;
    font-size: 14px;
    }

    #issueTable tbody tr {
    border-bottom: 1px solid #e1e4e8;
    transition: background-color 0.2s ease;
    }

    #issueTable tbody tr:hover {
    background-color: #f4f5f7;
    cursor: pointer;
    }

    #issueTable tbody td {
    border-right: 1px solid #e1e4e8;
    }

    #issueTable tbody td:last-child {
    border-right: none;
    }

    .col1 {
    background-color: #f0f5ff; /* light blue tint */
    font-weight: 500;
    }

    .col2 {
    background-color: #e6f4ea; /* light green tint */
    }

    .col3 {
    background-color: #fff8e1; /* light yellow tint */
    }
  </style>
</head>
<body>
  <div>
    <table id="issueTable">
      <thead>
        <tr>
          <th class="col1">Step</th>
          <th class="col2">Assignee</th>
          <th class="col3">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col1" id="col1-r1-value">Loading...</td>
          <td class="col2" id="col2-r1-value">Loading...</td>
          <td class="col3" id="col3-r1-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r2-value">Loading...</td>
          <td class="col2" id="col2-r2-value">Loading...</td>
          <td class="col3" id="col3-r2-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r3-value">Loading...</td>
          <td class="col2" id="col2-r3-value">Loading...</td>
          <td class="col3" id="col3-r3-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r4-value">Loading...</td>
          <td class="col2" id="col2-r4-value">Loading...</td>
          <td class="col3" id="col3-r4-value">Loading...</td>
        </tr>
        <tr>
          <td class="col1" id="col1-r5-value">Loading...</td>
          <td class="col2" id="col2-r5-value">Loading...</td>
          <td class="col3" id="col3-r5-value">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function waitForContext(tries) {
    tries = tries || 0;

    if (AdaptavistBridge && AdaptavistBridgeContext && AdaptavistBridgeContext.context) {
      loadIssueWithContext(AdaptavistBridgeContext.context);
      return;
    }
    if (tries > 20) {
      for (var i = 1; i <= 5; i++) {
        setText(`col1-r${i}-value`, 'No context from bridge');
        setText(`col2-r${i}-value`, 'No context from bridge');
        setText(`col3-r${i}-value`, 'No context from bridge');
      }
      return;
    }
    setTimeout(function () { waitForContext(tries + 1); }, 100);
  }

  function loadIssueWithContext(ctx) {
    var issueKey = ctx && ctx.issueKey ? ctx.issueKey : 'AP-1';
    AdaptavistBridge.request({
      url: `/rest/api/2/issue/${issueKey}`,
      type: 'GET'
    })
    .then(function(issue) {
      console.log('Issue:', issue);
      console.log('Links:', issue.issuelinks);

      var links = issue.fields.issuelinks || [];
      for (var i = 0; i < 5; i++) {
        if (links[i] && links[i].outwardIssue) {
            (function(index) {
            var linkedIssue = links[index].outwardIssue;
            setText(`col1-r${index+1}-value`, linkedIssue.fields.summary || 'No summary');
            setText(`col2-r${index+1}-value`, linkedIssue.fields.assignee ? linkedIssue.fields.assignee.displayName : 'Unassigned');

            AdaptavistBridge.request({
                url: `/rest/api/2/issue/${linkedIssue.key}`,
                type: 'GET'
            })
            .then(function(detailedIssue) {
                var subtasks = detailedIssue.fields.subtasks || [];
                if (subtasks.length === 0) {
                setText(`col3-r${index+1}-value`, linkedIssue.fields.status ? linkedIssue.fields.status.name : 'No status');
                } else {
                var subtaskStatuses = subtasks.map(function(subtask) {
                    return subtask.fields.status ? subtask.fields.status.name : 'No status';
                });
                setText(`col3-r${index+1}-value`, subtaskStatuses.join(', '));
                }
            })
            .catch(function(err) {
                setText(`col3-r${index+1}-value`, 'Ошибка загрузки сабтасок');
            });
            })(i);
        } else {
            setText(`col1-r${i+1}-value`, 'No linked issue');
            setText(`col2-r${i+1}-value`, '');
            setText(`col3-r${i+1}-value`, '');
        }
    }

    })
    .catch(function(err) {
      console.error('Error loading issue:', err);
      for (var i = 1; i <= 5; i++) {
        setText(`col1-r${i}-value`, 'Error loading issue');
        setText(`col2-r${i}-value`, 'Error loading issue');
        setText(`col3-r${i}-value`, 'Error loading issue');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { waitForContext(0); }, 200);
  });
</script>
</body>
</html>
